version: '3.8'

services:
  # ADSBItalia Station Radar (Modern Avionics Web Radar & Settings Panel)
  station-radar:
    image: ghcr.io/adsbitalia/station-radar:latest
    container_name: adsbitalia-station-radar
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # Persistent configuration and custom uploaded logos
      - ./config.json:/app/config.json
      - ./custom_images:/app/web/images/custom
      # Option A (Bare-metal): Mount local readsb / dump1090 data feed
      # - /run/readsb:/run/readsb:ro
    environment:
      - PORT=8088
      - PYTHONUNBUFFERED=1
      # Option B (Ultrafeeder / Docker): Simply uncomment TAR1090_URL below:
      # - TAR1090_URL=http://ultrafeeder/
      # Security (Optional): Password-protect settings from unauthorized public edits
      # - ADMIN_PASSWORD=your_secret_password
